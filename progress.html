<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress - FitTrack</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">P<span class="highlight">A</span>LESTR<span class="highlight">A</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="workouts.html">Workouts</a></li>
            <li><a href="progress.html" class="active">Progress</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
    </nav>

    <main class="progress-page">
        <h1>Your Progress</h1>

        <div class="stats-container">
            <div class="stat-card">
                <h3>Total Workouts</h3>
                <p id="totalWorkouts">0</p>
            </div>
            <div class="stat-card">
                <h3>This Week</h3>
                <p id="weeklyWorkouts">0</p>
            </div>
            <div class="stat-card">
                <h3>Streak</h3>
                <p id="streak">0 days</p>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <h2>Workout History</h2>
                <canvas id="workoutChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>Exercise Progress</h2>
                <canvas id="progressChart"></canvas>
            </div>
        </div>

        <div class="history-container">
            <h2>Recent Workouts</h2>
            <div id="workoutHistory" class="workout-history">
                <!-- Workout history will be populated by JavaScript -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
