<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Palestra</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">P<span class="highlight">A</span>LESTR<span class="highlight">A</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="workouts.html">Workouts</a></li>
            <li><a href="progress.html">Progress</a></li>
            <li><a href="profile.html" class="active">Profile</a></li>
        </ul>
    </nav>

    <main class="profile-page">
        <h1>Your Profile</h1>

        <div class="profile-container">
            <div class="profile-info">
                <div class="profile-picture">
                    <div class="profile-image-container">
                        <img id="profileImage" src="https://via.placeholder.com/150" alt="Profile Picture">
                        <div class="profile-image-overlay">
                            <i class="fas fa-camera"></i>
                            <span>Change Photo</span>
                        </div>
                    </div>
                    <div class="profile-upload-options">
                        <button class="btn secondary" id="uploadPhoto">
                            <i class="fas fa-image"></i> Upload from Gallery
                        </button>
                        <button class="btn secondary" id="takeSelfie">
                            <i class="fas fa-camera"></i> Take Selfie
                        </button>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" style="display: none">
                </div>

                <form id="profileForm" class="profile-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" required>
                    </div>

                    <div class="form-group">
                        <label for="height">Height (cm)</label>
                        <input type="number" id="height" name="height" required>
                    </div>

                    <div class="form-group">
                        <label for="weight">Weight (kg)</label>
                        <input type="number" id="weight" name="weight" required>
                    </div>

                    <div class="form-group">
                        <label for="goal">Fitness Goal</label>
                        <select id="goal" name="goal">
                            <option value="weight-loss">Weight Loss</option>
                            <option value="muscle-gain">Muscle Gain</option>
                            <option value="maintenance">Maintenance</option>
                            <option value="endurance">Endurance</option>
                        </select>
                    </div>

                    <button type="submit" class="btn primary">Save Changes</button>
                </form>
            </div>

            <div class="settings">
                <h2>Settings</h2>
                <div class="settings-group">
                    <label>
                        <input type="checkbox" id="notifications"> Enable Notifications
                    </label>
                </div>
                <div class="settings-group">
                    <label>
                        <input type="checkbox" id="darkMode"> Dark Mode
                    </label>
                </div>
                <div class="settings-group">
                    <label for="units">Preferred Units</label>
                    <select id="units">
                        <option value="metric">Metric (kg, cm)</option>
                        <option value="imperial">Imperial (lbs, in)</option>
                    </select>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for selfie capture -->
    <div id="selfieModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Take a Selfie</h2>
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="canvasElement" style="display: none;"></canvas>
            <div class="modal-buttons">
                <button class="btn secondary" id="captureSelfie">
                    <i class="fas fa-camera"></i> Capture
                </button>
                <button class="btn primary" id="saveSelfie" style="display: none">
                    <i class="fas fa-save"></i> Save
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
