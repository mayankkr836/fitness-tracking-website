<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - PALESTRA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="account.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="account-page">
    <nav class="navbar">
        <a href="index.html" class="logo">P<span class="highlight">A</span>LESTR<span class="highlight">A</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="fitness.html">Fitness</a></li>
            <li><a href="sports.html">Sports</a></li>
            <li><a href="yoga.html">Yoga</a></li>
            <li><a href="nutrition.html">Nutrition</a></li>
            <li><a href="workouts.html">Workouts</a></li>
            <li><a href="progress.html">Progress</a></li>
            <li><a href="#" id="downloadBtn">Download</a></li>
        </ul>
    </nav>

    <div class="account-container">
        <div class="account-sidebar">
            <div class="user-profile">
                <div class="profile-image">
                    <img src="https://via.placeholder.com/150" alt="Profile Picture">
                    <button class="edit-photo"><i class="fas fa-camera"></i></button>
                </div>
                <h3>Welcome Back</h3>
                <p class="user-email">user@example.com</p>
            </div>
            <ul class="account-menu">
                <li class="active"><a href="#profile"><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="#subscription"><i class="fas fa-crown"></i> Subscription</a></li>
                <li><a href="#settings"><i class="fas fa-cog"></i> Settings</a></li>
                <li><a href="#privacy"><i class="fas fa-shield-alt"></i> Privacy</a></li>
                <li><a href="#notifications"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="#help"><i class="fas fa-question-circle"></i> Help & Support</a></li>
                <li class="logout"><a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>

        <div class="account-content">
            <section id="profile" class="account-section active">
                <h2>Profile Information</h2>
                <form class="profile-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" value="John Doe" placeholder="Enter your full name">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Age</label>
                            <input type="number" value="25" placeholder="Enter your age">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="user@example.com" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" placeholder="Enter your phone number">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Height (cm)</label>
                            <input type="number" placeholder="Enter your height">
                        </div>
                        <div class="form-group">
                            <label>Weight (kg)</label>
                            <input type="number" placeholder="Enter your weight">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Fitness Goals</label>
                        <textarea placeholder="Describe your fitness goals"></textarea>
                    </div>
                    <button type="submit" class="save-btn">Save Changes</button>
                </form>
            </section>
        </div>
    </div>

    <script src="account.js"></script>
</body>
</html>
