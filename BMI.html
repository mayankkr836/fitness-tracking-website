<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator | [Your Fitness Website]</title>
    <link rel="stylesheet" href="BMI.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>BMI Calculator</h1>
            <p>Calculate your Body Mass Index (BMI) and understand how it relates to your health.</p>
        </div>
    </header>

    <main>
        <section id="bmi-calculation" class="section">
            <div class="container">
                <h2>Calculate Your BMI</h2>
                <form id="bmi-form" class="bmi-form">
                    <div class="form-group">
                        <label for="weight">Weight (kg):</label>
                        <input type="number" id="weight" name="weight" placeholder="Enter your weight in kg" required>
                    </div>
                    <div class="form-group">
                        <label for="height">Height (cm):</label>
                        <input type="number" id="height" name="height" placeholder="Enter your height in cm" required>
                    </div>
                    <button type="submit" class="btn">Calculate BMI</button>
                </form>

                <div id="result" class="result">
                    <h3>Your BMI: <span id="bmi-result">-</span></h3>
                    <p id="bmi-category">-</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 palestra. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="BMI.JS"></script>
</body>
</html>
